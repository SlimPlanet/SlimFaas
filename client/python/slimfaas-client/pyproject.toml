[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slimfaas-client"
version = "0.1.0"
description = "WebSocket client for SlimFaas — lets Jobs and virtual functions receive async requests and publish/subscribe events without exposing an HTTP port."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["slimfaas", "websocket", "faas", "jobs"]
authors = [{ name = "SlimFaas Contributors" }]

dependencies = [
    "websockets>=16.1.1,<17",
]

[project.urls]
Homepage = "https://slimfaas.dev/"
Repository = "https://github.com/SlimPlanet/SlimFaas"
Issues = "https://github.com/SlimPlanet/SlimFaas/issues"
Documentation = "https://slimfaas.dev/"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "anyio>=4.16.0",
    # Pygments 2.21.0 is rejected by the CNCF FOSSA policy (GPL findings).
    # Keep the last version validated by FOSSA until a newer release is approved.
    "pygments==2.19.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slimfaas_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
