# First create the exporter script ConfigMap; see external-autoscaling/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-exporter
  namespace: slimfaas-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-exporter
  template:
    metadata:
      labels:
        app: jobs-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: [python3, /demo/exporter.py, --host, 0.0.0.0, --port, "9090"]
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: script
              mountPath: /demo
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: external-metrics-demo
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-exporter
  namespace: slimfaas-demo
spec:
  selector:
    app: jobs-exporter
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: slimfaas-demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        SlimFaas/Function: "true"
        SlimFaas/ReplicasMin: "0"
        SlimFaas/ReplicasAtStart: "1"
        SlimFaas/TimeoutSecondBeforeSetReplicasMin: "10"
        SlimFaas/Scale: |
          {
            "ReplicaMax": 20,
            "ScaleFromZero": true,
            "ScrapeIntervalMilliseconds": 1000,
            "Sources": [{"Name": "jobs", "Url": "http://jobs-exporter.slimfaas-demo.svc.cluster.local:9090/metrics"}],
            "Triggers": [{"Source": "jobs", "MetricType": "AverageValue", "MetricName": "pending_jobs", "Query": "sum(jobs_pending{queue=\"emails\"})", "Threshold": 10}],
            "Behavior": {
              "ScaleUp": {"StabilizationWindowSeconds": 0, "Policies": [{"Type": "Pods", "Value": 20, "PeriodSeconds": 15}]},
              "ScaleDown": {"StabilizationWindowSeconds": 20, "Policies": [{"Type": "Percent", "Value": 100, "PeriodSeconds": 15}]}
            }
          }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: python:3.12-alpine
          command: [python3, /demo/exporter.py, --worker, --host, 0.0.0.0, --port, "8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: script
              mountPath: /demo
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: external-metrics-demo
