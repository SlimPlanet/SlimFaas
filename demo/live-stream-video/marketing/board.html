<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SlimFaas | Zero idle replicas</title>
<style>
body { margin: 0; }
.film, .film * { box-sizing: border-box; }
.film [hidden] { display: none; }
.film {
  --color-primary: #0000ff; --ink: #15263f; --muted: #51617a; --line: #dce4ef; --soft: #f0f0ff; --surface: #f7f9fc;
  width: 1080px; height: 1350px; position: relative; overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: white; color: var(--ink); -webkit-font-smoothing: antialiased;
}
.film__header { height: 116px; padding: 0 62px; display: flex; gap: 18px; align-items: center; background: var(--color-primary); color: white; }
.film__logo { width: 64px; height: 64px; padding: 5px; background: white; border-radius: 12px; }
.film__brand { font-size: 44px; letter-spacing: -1.7px; font-weight: 750; }
.film__signature { margin-left: auto; color: #ededff; font-size: 30px; }
.film__story, .film__case, .film__close { position: absolute; inset: 179px 64px auto; }
.film__intro { height: 239px; }
.film__headline { margin: 0; font-size: 86px; line-height: 1.02; letter-spacing: -4px; font-weight: 750; text-wrap: balance; }
.film__detail { margin: 18px 0 0; color: var(--muted); font-size: 38px; line-height: 1.15; letter-spacing: -.8px; }
.film--idle .film__headline { font-size: 104px; }
.film--idle .film__detail { color: var(--color-primary); font-weight: 600; font-size: 47px; }
.film__monitor { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
.film__monitor-head { display: flex; justify-content: space-between; align-items: center; padding: 17px 24px; border-bottom: 2px solid var(--line); background: white; font-size: 27px; }
.film__source { color: var(--muted); font-size: 24px; }
.film__capture { width: 100%; height: 418px; display: block; object-fit: contain; }
.film__metrics { display: flex; border-top: 2px solid var(--line); background: white; padding: 20px 24px 24px; gap: 44px; align-items: center; }
.film__metric { display: flex; align-items: baseline; gap: 12px; }
.film__value { font-size: 55px; font-weight: 740; color: var(--color-primary); letter-spacing: -2px; line-height: 1; }
.film__unit { font-size: 27px; color: var(--ink); }
.film__case, .film__close { inset-block-start: 226px; }
.film__label { margin: 0 0 27px; color: var(--muted); font-size: 32px; font-weight: 600; }
.film__stat { display: block; margin-left: -9px; font-weight: 760; font-size: 222px; line-height: 1; letter-spacing: -13px; color: var(--color-primary); }
.film__case-title { max-width: 835px; margin: 23px 0 0; font-size: 86px; line-height: 1.01; letter-spacing: -4px; }
.film__credit { margin: 64px 0 0; padding: 6px 0 6px 27px; border-left: 6px solid var(--color-primary); font-size: 35px; line-height: 1.38; }
.film__credit span { display: block; color: var(--muted); }
.film__close-title { max-width: 900px; font-weight: 750; font-size: 112px; line-height: 1.01; letter-spacing: -6px; margin: 0; text-wrap: balance; }
.film__example { background: var(--surface); border: 2px solid var(--line); border-radius: 13px; padding: 30px 34px; margin: 49px 0 0; font: 33px/1.6 ui-monospace, Menlo, monospace; }
.film__method { color: var(--color-primary); font-weight: 700; }
.film__result { color: var(--muted); }
.film__address { display: block; margin-top: 40px; font-size: 43px; font-weight: 700; color: var(--color-primary); letter-spacing: -1.5px; }
.film__captions { position: absolute; inset: auto 64px 67px; min-height: 138px; display: flex; align-items: center; border-top: 3px solid var(--line); padding-top: 16px; }
.film__caption { margin: 0; max-width: 944px; font-size: 43px; font-weight: 520; line-height: 1.16; letter-spacing: -.9px; text-wrap: pretty; }
</style>

<main class="film">
  <header class="film__header">
    <img class="film__logo" alt="" width="64" height="64"><strong class="film__brand">SlimFaas</strong>
    <span class="film__signature" data-fr="Des fonctions. Moins d’infrastructure.">Functions. Less infrastructure.</span>
  </header>
  <section class="film__story" hidden>
    <div class="film__intro"><h1 class="film__headline"></h1><p class="film__detail"></p></div>
    <div class="film__monitor">
      <div class="film__monitor-head"><strong>Live Stream</strong><span class="film__source"></span></div>
      <img class="film__capture" alt="Fibonacci deployment in the recorded SlimFaas dashboard">
      <div class="film__metrics"></div>
    </div>
  </section>
  <section class="film__case" hidden>
    <p class="film__label">Reported by one platform team</p>
    <strong class="film__stat">&gt;60%</strong><h1 class="film__case-title"></h1>
    <p class="film__credit"><b>Guillaume Chervet, AXA France</b><span>Devoxx Belgium 2025</span></p>
  </section>
  <section class="film__close" hidden>
    <p class="film__label">Run the local demo</p><h1 class="film__close-title"></h1>
    <div class="film__example"><span class="film__method">POST</span> /function/fibonacci1/fibonacci<br>{"input": 10}<br><span class="film__result"></span></div>
    <span class="film__address">slimfaas.dev/get-started/local</span>
  </section>
  <div class="film__captions"><p class="film__caption"></p></div>
</main>
</html>
