<style>
.film__house { position: absolute; inset: 116px 0 auto; }
.house-film__stage { position: relative; background: #13243f; }
.house-film__skyline { width: 100%; height: 730px; display: block; }
.house-film__title { position: absolute; left: 63px; top: 39px; margin: 0; max-width: 805px; color: #fff; font-size: 66px; line-height: 1.04; letter-spacing: -3px; font-weight: 740; text-wrap: balance; }
.house-film__ledger { position: relative; margin: 22px 62px 0; padding: 16px 22px 18px; height: 220px; background: var(--surface); border: 2px solid var(--line); border-radius: 13px; }
.house-film__ledger-head { display: flex; align-items: baseline; justify-content: space-between; gap: 22px; border-bottom: 2px dashed #c5cfdd; padding-bottom: 10px; }
.house-film__ledger-head strong { color: var(--ink); font-size: 27px; }
.house-film__tariff { color: var(--muted); font-size: 25px; }
.house-film__readings { display: grid; grid-template-columns: .85fr 1.04fr 1.08fr 1.18fr; margin: 13px 0 0; }
.house-film__readings dt { color: var(--muted); font-size: 23px; }
.house-film__readings dd { font-size: 47px; line-height: 1.16; letter-spacing: -2px; font-weight: 720; font-variant-numeric: tabular-nums; margin: 5px 0 0; }
.house-film__charge { color: var(--color-primary); }
.house-film__comparison { margin: 6px 0 0; color: var(--color-primary); font-size: 24px; font-weight: 650; }
</style>
