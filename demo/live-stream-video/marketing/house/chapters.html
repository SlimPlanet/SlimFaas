<style>
.house-film__opening { position: absolute; inset: 0 0 auto; height: 984px; overflow: hidden; padding: 45px 63px; color: var(--ink); background: white; }
.house-film__promise { margin: 0; font-size: 75px; font-weight: 740; line-height: 1.02; letter-spacing: -4px; }
.house-film__promise span, .house-film__promise strong { display: block; }
.house-film__promise strong { font-size: 174px; line-height: 1; letter-spacing: -10px; color: var(--color-primary); }
.house-film__opening-art { position: absolute; bottom: 72px; left: 0; width: 100%; height: 480px; }
.house-film__scenario { position: absolute; bottom: 13px; left: 63px; margin: 0; color: var(--muted); font-size: 29px; }
.house-film__diagram { position: absolute; inset: 0; display: block; width: 100%; height: 730px; }
.house-film__architecture-ledger { font-variant-numeric: tabular-nums; }
.house-film__polar { height: 990px; background: white; }
.house-film__ice { display: block; width: 100%; height: 565px; }
.house-film__pitch { padding: 28px 63px 0; }
.house-film__pitch h1 { margin: 0 0 17px; font-size: 70px; line-height: 1.02; letter-spacing: -3.5px; }
.house-film__pitch p { margin: 0; max-width: 940px; color: var(--muted); font-size: 37px; line-height: 1.27; }
.house-film__pitch strong { color: var(--color-primary); }
.house-film__pitch ul { margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 9px 16px; list-style: none; font-size: 32px; line-height: 1.24; }
.house-film__pitch li { border-bottom: 2px solid var(--line); padding: 4px 0 9px; }
.house-film__pitch-address { display: block; margin-top: 20px; font-size: 36px; font-weight: 680; color: var(--color-primary); }
.house-film__savings-bar { margin-top: 22px; height: 16px; border-radius: 8px; overflow: hidden; background: var(--color-primary); }
.house-film__savings-bar div { height: 100%; background: #aebcd1; }
.house-film__savings-labels { display: flex; justify-content: space-between; margin-top: 7px; font-size: 25px; font-variant-numeric: tabular-nums; }
.house-film__savings-labels b:last-child { color: var(--color-primary); }
.house-film__annual-figure { display: flex; align-items: baseline; gap: 20px; font-size: 32px; font-weight: 640; }
.house-film__annual-total { display: block; font-size: 100px; line-height: 1; letter-spacing: -5px; font-variant-numeric: tabular-nums; }
.house-film__months { display: flex; gap: 7px; margin: 12px 0; }
.house-film__month { flex: 1; height: 12px; border-radius: 3px; background: var(--line); }
.house-film__month--saved { background: var(--color-primary); }
.film--year .house-film__pitch h1 { font-size: 52px; margin-bottom: 10px; }
.film--year .house-film__pitch p { font-size: 30px; }
.film--year .house-film__pitch-address { margin-top: 12px; }
:lang(fr) .house-film__promise { font-size: 70px; }
</style>
