apiVersion: v1
kind: Namespace
metadata:
  name: slimfaas-demo
  labels:
    name: slimfaas
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slimfaas
  namespace: slimfaas-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-statefulset-manager
  namespace: slimfaas-demo
rules:
  - apiGroups: ['']
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, update, patch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slimfaas-deployment-statefulset-manager
  namespace: slimfaas-demo
subjects:
  - kind: ServiceAccount
    name: slimfaas
    namespace: slimfaas-demo
roleRef:
  kind: Role
  name: deployment-statefulset-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpoints-viewer
  namespace: slimfaas-demo
rules:
  - apiGroups: ['']
    resources: [endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slimfaas-endpoints-viewer
  namespace: slimfaas-demo
subjects:
  - kind: ServiceAccount
    name: slimfaas
    namespace: slimfaas-demo
roleRef:
  kind: Role
  name: endpoints-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slimfaas
  namespace: slimfaas-demo
spec:
  replicas: 3
  podManagementPolicy: OrderedReady
  serviceName: slimfaas
  selector:
    matchLabels:
      app: slimfaas
  volumeClaimTemplates:
    - metadata:
        name: slimfaas-volume
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: slimfaas-backup
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app: slimfaas
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '5000'
        prometheus.io/scrape: 'true'
    spec:
      serviceAccountName: slimfaas
      containers:
        - name: slimfaas
          image: docker.io/axaguildev/slimfaas:0.89.1
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 8
            terminationGracePeriodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 8
          env:
            - name: SlimFaas__BaseSlimDataUrl
              value: http://{pod_name}.slimfaas.{namespace}.svc:3262
            - name: SlimData__Directory
              value: /database
            - name: SlimData__BackupDirectory
              value: /backup
            - name: SlimFaas__ExposeLogs
              value: 'true'
            - name: SlimFaas__ExposeDataMetadata
              value: 'false'
            - name: SlimFaas__DeadLetterQueue__EnableFront
              value: 'true'
            - name: SlimFaas__DeadLetterQueue__DefaultVisibility
              value: Public
            - name: SlimFaas__Streams__EnableFront
              value: 'true'
            - name: SlimFaas__Streams__DefaultVisibility
              value: Public
            - name: Data__DefaultVisibility
              value: Public
            - name: Logging__LogLevel__Default
              value: Information
            - name: Logging__LogLevel__SlimFaas
              value: Information
            - name: Logging__LogLevel__SlimData
              value: Information
            - name: SlimFaas__StatusStream__LiveEventSamplingRatio
              value: '1'
            - name: SlimFaas__StatusStream__MaxLiveEventsPerSecond
              value: '500'
          volumeMounts:
            - name: slimfaas-volume
              mountPath: /database
            - name: slimfaas-backup
              mountPath: /backup
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
          ports:
            - containerPort: 5000
              name: slimfaas
            - containerPort: 5003
              name: slimfaas-ws
            - containerPort: 3262
              name: slimdata
---
apiVersion: v1
kind: Service
metadata:
  name: slimfaas
  namespace: slimfaas-demo
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: 'true'
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: slimfaas
  ports:
    - name: http
      port: 5000
    - name: slimfaas-ws
      port: 5003
    - name: slimdata
      port: 3262
---
apiVersion: v1
kind: Service
metadata:
  name: slimfaas-http
  namespace: slimfaas-demo
spec:
  publishNotReadyAddresses: false
  selector:
    app: slimfaas
  ports:
    - name: http
      port: 5000
      targetPort: 5000
    - name: slimfaas-ws
      port: 5003
      targetPort: 5003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fibonacci1
  namespace: slimfaas-demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fibonacci1
  template:
    metadata:
      labels:
        app: fibonacci1
      annotations:
        SlimFaas/Function: 'true'
        SlimFaas/Configuration: |-
          {
            "DefaultAsync": {
              "HttpTimeout": 300,
              "TimeoutRetries": [],
              "HttpStatusRetries": []
            }
          }
        SlimFaas/StreamMaxAge: 24h
        SlimFaas/StreamMaxLength: '100000'
        SlimFaas/TimeoutSecondBeforeSetReplicasMin: '20'
        SlimFaas/NumberParallelRequest: '4'
        SlimFaas/NumberParallelRequestPerPod: '1'
        SlimFaas/ReplicasAtStart: '1'
        SlimFaas/ReplicasMin: '0'
        prometheus.io/path: /metrics
        prometheus.io/port: '5000'
        prometheus.io/scrape: 'true'
        SlimFaas/Scale: |-
          {
            "ReplicaMax": 4,
            "Triggers": [
              {
                "MetricType": "AverageValue",
                "MetricName": "max_over_time_queue_fibonacci1",
                "Query": "max_over_time(slimfaas_function_queue_ready_items{function=\"fibonacci1\"}[30s])",
                "Threshold": 5
              }
            ],
            "Behavior": {
              "ScaleUp": {
                "StabilizationWindowSeconds": 0,
                "Policies": [
                  {
                    "Type": "Pods",
                    "Value": 3,
                    "PeriodSeconds": 2
                  }
                ]
              },
              "ScaleDown": {
                "StabilizationWindowSeconds": 30,
                "Policies": [
                  {
                    "Type": "Pods",
                    "Value": 1,
                    "PeriodSeconds": 10
                  }
                ]
              }
            }
          }
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: fibonacci1
          image: docker.io/axaguildev/fibonacci-api:0.89.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 1
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5000
          resources:
            requests:
              cpu: 150m
              memory: 64Mi
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: fibonacci1
  namespace: slimfaas-demo
spec:
  selector:
    app: fibonacci1
  ports:
    - port: 5000
      targetPort: 5000
