# Partial development overlay applied after slimfaas.local.yaml.
cluster:
  nodes: 1

state:
  mode: ephemeral

functions:
  fibonacci1:
    command:
      - dotnet
      - watch
      - run
      - --project
      - Fibonacci.csproj
      - --no-launch-profile
    annotations:
      SlimFaas/ReplicasAtStart: "1"
      SlimFaas/Scale: '{"ReplicaMax": 3, "Triggers": [], "Behavior": {}}'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FIBONACCI_API_KEY: "${FIBONACCI_API_KEY}"

jobs:
  fibonacci:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FIBONACCI_API_KEY: "${FIBONACCI_API_KEY}"

processes:
  fibonacci-front:
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 127.0.0.1
      - --port
      - "{port}"
    workingDirectory: src/FibonacciReact
    environment:
      BROWSER: "none"
      VITE_SLIMFAAS_URL: "http://127.0.0.1:30020"
    port: auto
    restartPolicy: always
