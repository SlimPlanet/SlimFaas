name: Build release candidate
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  matrices:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - id: matrix
        run: python3 .bin/build-release.py matrices
  native:
    needs: matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.native) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Build and smoke-test native distribution
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
          RID: ${{ matrix.rid }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: python .bin/build-release.py native --product "$PRODUCT" --rid "$RID" --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.product }}-${{ matrix.rid }}
          path: artifacts/release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.14.0'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.0'
      - name: Build, test, and install packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: python .bin/build-release.py packages --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-packages
          path: artifacts/release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  images:
    needs: matrices
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrices.outputs.images) }}
    uses: ./.github/workflows/Docker.yml
    with:
      name: ${{ matrix.name }}
      file: ${{ matrix.file }}
      context: ${{ matrix.context }}
      platforms: ${{ matrix.platforms }}
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
  assemble:
    needs: [native, packages, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: artifacts/release
      - run: python3 .bin/install-release-tools.py syft
      - name: Generate and validate resolved dependency SBOMs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_CHANNEL: validate
        run: |
          python3 .bin/build-release.py sbom --version "$RELEASE_VERSION"
          python3 .bin/release.py inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate
          path: artifacts/release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
