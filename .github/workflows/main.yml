name: SlimFaas main CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'slimfaas-release' || format('ci-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PNPM_VERSION: '10.14.0'
  NODE_VERSION: '24.21.0'
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  sonarcloud:
    name: SonarCloud
    runs-on: windows-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false) && github.actor != 'dependabot[bot]'
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner-11.3.0
          restore-keys: ${{ runner.os }}-sonar-scanner-11.3.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --version 11.3.0 --tool-path .\.sonar\scanner

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: pnpm ci
        run: pnpm i --frozen-lockfile
        working-directory: ./src/SlimFaasPlanetSaver

      - name: pnpm run coverage
        run: |
          pnpm run coverage
          Remove-Item -Path .\coverage\lcov-report -Recurse -Force
        working-directory: ./src/SlimFaasPlanetSaver

      - name: Test peer polling benchmark with coverage
        run: python .bin/test-status-stream-benchmark.py --coverage status-stream-coverage.xml

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"SlimPlanet_SlimFaas" /o:"slimplanet" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.coverageReportPaths=status-stream-coverage.xml /d:sonar.coverage.exclusions="samples/**/*,benchmarks/**/*,demo/**/*,src/SlimFaasPlanetSaver/coverage/**/*,src/SlimFaasSite/**/*,.bin/**/*" /d:sonar.javascript.lcov.reportPaths="src/SlimFaasPlanetSaver/coverage/lcov.info" /d:sonar.javascript.file.suffixes="js,jsx"
          dotnet tool install --global dotnet-coverage --version 18.12.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"
          $testExitCode = $LASTEXITCODE
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($testExitCode -ne 0) { exit $testExitCode }

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
  candidate:
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      source_sha: ${{ github.sha }}
  required:
    name: CI / required
    if: always()
    needs: [checks, sonarcloud, candidate]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          SONAR: ${{ needs.sonarcloud.result }}
          SONAR_OPTIONAL: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          test "$CHECKS" = success
          test "$CANDIDATE" = success
          test "$SONAR" = success || { test "$SONAR_OPTIONAL" = true && test "$SONAR" = skipped; }
  release_bot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASES_ENABLED == 'true'
    needs: required
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
  publish:
    needs: release_bot
    if: needs.release_bot.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      tag: ${{ needs.release_bot.outputs.tag }}
      use_existing_build: true
  # Keep PyPI OIDC at the top level: PyPI does not support reusable callers.
  publish_pypi:
    needs: [release_bot, publish]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.release_bot.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release
        with:
          version: ${{ env.RELEASE_VERSION }}
          source_sha: ${{ env.RELEASE_SHA }}
      - id: existing
        run: python3 .bin/release.py registry-status
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.existing.outputs.pypi_pending == 'true'
        with:
          packages-dir: artifacts/pypi-pending
          attestations: true
  finalize:
    needs: [release_bot, publish, publish_pypi]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.release_bot.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release
        with:
          version: ${{ env.RELEASE_VERSION }}
          source_sha: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: python3 .bin/release.py finalize
  deploy_website:
    needs: required
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./src/SlimFaasSite

      - name: Build site
        run: pnpm build
        working-directory: ./src/SlimFaasSite

      - name: Add CNAME file
        run: echo 'slimfaas.dev' > out/CNAME
        working-directory: ./src/SlimFaasSite

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/SlimFaasSite/out
          cname: slimfaas.dev
