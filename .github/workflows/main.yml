name: SlimFaas main CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'slimfaas-release' || format('ci-{0}', github.event.pull_request.number) }}
  queue: max
  cancel-in-progress: false
env:
  PNPM_VERSION: '12.18.0'
  NODE_VERSION: '26.13.0'
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  sonarcloud:
    needs: checks
    name: SonarCloud
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false) && github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-coverage
          path: artifacts/dashboard-coverage

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner-11.3.0-${{ hashFiles('global.json') }}
          restore-keys: ${{ runner.os }}-sonar-scanner-11.3.0-

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force | Out-Null
          dotnet tool update dotnet-sonarscanner --version 11.3.0 --tool-path .\.sonar\scanner

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: pnpm ci
        run: pnpm i --frozen-lockfile
        working-directory: ./src/SlimFaasPlanetSaver

      - name: pnpm run coverage
        run: |
          pnpm run coverage
          Remove-Item -Path .\coverage\lcov-report -Recurse -Force
        working-directory: ./src/SlimFaasPlanetSaver

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test Python client with coverage
        shell: powershell
        run: |
          uv sync --project client/python/slimfaas-client --frozen --extra dev --no-build --no-install-project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --project client/python/slimfaas-client --no-sync --no-build python .bin/test-python-client.py --coverage python-client-coverage.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test peer polling benchmark with coverage
        run: python .bin/test-status-stream-benchmark.py --coverage status-stream-coverage.xml

      - name: Test benchmark provenance and file validation
        run: python .bin/test-zlinq-benchmark.py

      - name: Verify benchmark analysis exclusions preserve production sources
        run: |
          python .bin/test-sonar-benchmark-boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .bin/check-sonar-benchmark-boundary.py --report artifacts/sonar-boundary/inventory.json

      - name: Build and analyze
        # Benchmark tools remain built/tested; only their static analysis is excluded.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $benchmarkExclusions = python .bin/check-sonar-benchmark-boundary.py --print-patterns
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $typescriptConfigurations = python .bin/check-sonar-benchmark-boundary.py --print-tsconfigs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Each .NET module runs its own JS sensor from a different base directory.
          # Resolve Linux LCOV source paths against this Windows checkout before scanning.
          $dashboardReports = Get-Item artifacts/dashboard-coverage/browser.info,artifacts/dashboard-coverage/unit.info
          foreach ($report in $dashboardReports) {
            $lines = foreach ($line in [IO.File]::ReadLines($report.FullName)) {
              if ($line.StartsWith('SF:')) { 'SF:' + (Resolve-Path -LiteralPath $line.Substring(3) -ErrorAction Stop).Path }
              else { $line }
            }
            [IO.File]::WriteAllLines($report.FullName, [string[]]$lines)
          }
          $coverageReports = @((Get-Item src/SlimFaasPlanetSaver/coverage/lcov.info).FullName) + $dashboardReports.FullName -join ','
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"SlimPlanet_SlimFaas" /o:"slimplanet" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.qualitygate.wait=true /d:sonar.exclusions="$benchmarkExclusions" /d:sonar.test.exclusions="$benchmarkExclusions" /d:sonar.typescript.tsconfigPaths="$typescriptConfigurations" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.coverageReportPaths="python-client-coverage.xml" /d:sonar.coverage.exclusions="samples/**/*,benchmarks/**/*,demo/**/*,docs/reliability/*/scripts/*.py,src/SlimFaasPlanetSaver/coverage/**/*,src/SlimFaasSite/**/*,.bin/**/*,client/python/**/tests/**/*" /d:sonar.javascript.lcov.reportPaths="$coverageReports" /d:sonar.javascript.file.suffixes="js,jsx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --global dotnet-coverage --version 18.12.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"
          $testExitCode = $LASTEXITCODE
          python .bin/check-sonar-benchmark-boundary.py --project-directory .sonarqube/out --report artifacts/sonar-boundary/submitted-projects.json
          $metadataExitCode = $LASTEXITCODE
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN" 2>&1 | Tee-Object -FilePath artifacts/sonar-boundary/scanner-end.log
          $scanExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($metadataExitCode -ne 0) { exit $metadataExitCode }
          if ($scanExitCode -ne 0) { exit $scanExitCode }

      - name: Verify completed scan scope and production coverage import
        # A failing test must still fail this job, but must not hide the scope
        # and coverage evidence from an analysis that was actually submitted.
        if: ${{ !cancelled() && hashFiles('.sonarqube/out/**/report-task.txt') != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python .bin/check-sonar-benchmark-boundary.py --scan-directory .sonarqube/out --report artifacts/sonar-boundary/completed-scan.json

      - name: Retain analysis boundary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-analysis-boundary
          path: artifacts/sonar-boundary
          retention-days: 14

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
  candidate:
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      source_sha: ${{ github.sha }}
  required:
    name: CI / required
    if: always()
    needs: [checks, sonarcloud, candidate]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          SONAR: ${{ needs.sonarcloud.result }}
          SONAR_OPTIONAL: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          test "$CHECKS" = success
          test "$CANDIDATE" = success
          test "$SONAR" = success || { test "$SONAR_OPTIONAL" = true && test "$SONAR" = skipped; }
  release_bot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASES_ENABLED == 'true'
    needs: required
    runs-on: ubuntu-24.04
    environment: release-bot
    outputs:
      created: ${{ steps.candidate.outputs.created }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .bin/install-release-tools.py gh
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
      - id: candidate
        name: Select only the draft built by this source run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .bin/release.py stable-candidate
  publish:
    needs: release_bot
    if: needs.release_bot.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      checks: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      tag: ${{ needs.release_bot.outputs.tag }}
      use_existing_build: true
  # Keep PyPI OIDC at the top level: PyPI does not support reusable callers.
  publish_pypi:
    needs: [release_bot, publish]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.release_bot.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release
        with:
          version: ${{ env.RELEASE_VERSION }}
          source_sha: ${{ env.RELEASE_SHA }}
      - id: existing
        run: python3 .bin/release.py registry-status
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.existing.outputs.pypi_pending == 'true'
        with:
          packages-dir: artifacts/pypi-pending
          attestations: true
  finalize:
    needs: [release_bot, publish, publish_pypi]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.release_bot.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-release
        with:
          version: ${{ env.RELEASE_VERSION }}
          source_sha: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global --ignore-scripts npm@11.21.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: python3 .bin/release.py finalize
  deploy_website:
    needs: required
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./src/SlimFaasSite

      - name: Build site
        run: pnpm build
        working-directory: ./src/SlimFaasSite

      - name: Add CNAME file
        run: echo 'slimfaas.dev' > out/CNAME
        working-directory: ./src/SlimFaasSite

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/SlimFaasSite/out
          cname: slimfaas.dev
