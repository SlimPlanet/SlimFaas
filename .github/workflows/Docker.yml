name: Build OCI archive
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      file:
        required: true
        type: string
      context:
        required: true
        type: string
      platforms:
        required: true
        type: string
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: mkdir -p artifacts/release
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: false
          outputs: type=oci,dest=artifacts/release/${{ inputs.name }}.oci.tar
          tags: axaguildev/${{ inputs.name }}:${{ inputs.version }}
          build-args: |
            RELEASE_VERSION=${{ inputs.version }}
            SOURCE_REVISION_ID=${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SlimPlanet/SlimFaas
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-image-${{ inputs.name }}
          path: artifacts/release/*.oci.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
