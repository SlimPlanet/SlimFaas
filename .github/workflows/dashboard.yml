name: Dashboard and documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: src/SlimFaas/ClientApp/package-lock.json
      - name: Install dashboard dependencies
        working-directory: src/SlimFaas/ClientApp
        run: npm ci --ignore-scripts
      - name: Test live models and stream handling
        working-directory: src/SlimFaas/ClientApp
        run: npm test
      - name: Test peer polling benchmark
        run: python .bin/test-status-stream-benchmark.py
      - name: Build dashboard and reproducible scenarios
        working-directory: src/SlimFaas/ClientApp
        run: |
          npm run build
          npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
  mcp-dashboard:
    name: MCP dashboard build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: src/SlimFaasMcp/ClientApp/package-lock.json
      - name: Install MCP dashboard dependencies
        working-directory: src/SlimFaasMcp/ClientApp
        run: npm ci --ignore-scripts
      - name: Test MCP chat adapter compatibility
        working-directory: src/SlimFaasMcp/ClientApp
        run: npm test
      - name: Build MCP dashboard
        working-directory: src/SlimFaasMcp/ClientApp
        run: npm run build
  traffic-e2e:
    name: Native traffic animations (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: src/SlimFaas/ClientApp/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install browser test dependencies
        working-directory: src/SlimFaas/ClientApp
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Publish native runtime and real function
        run: |
          dotnet publish src/SlimFaas/SlimFaas.csproj -c Release -r linux-x64 -o artifacts/traffic-e2e/runtime
          dotnet publish samples/Fibonacci/Fibonacci.csproj -c Release -o artifacts/traffic-e2e/fibonacci
      - name: Test traffic animations on three nodes
        working-directory: src/SlimFaas/ClientApp
        run: npm run test:e2e
      - name: Upload browser and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traffic-e2e
          path: |
            artifacts/traffic-e2e/results/
            artifacts/traffic-e2e/report/
          retention-days: 7
  documentation:
    uses: ./.github/workflows/SiteBuild.yml
  websocket-clients:
    name: WebSocket SDK configuration contracts (Python ${{ matrix.python }})
    strategy:
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test .NET client
        run: dotnet test client/dotnet/SlimFaasClient/tests/SlimFaasClient.Tests/SlimFaasClient.Tests.csproj
      - name: Test Python client
        working-directory: client/python/slimfaas-client
        env:
          PYTHONPATH: src
        run: |
          uv sync --frozen --extra dev --no-build --no-install-project
          uv run --no-sync --no-build python -m pytest
