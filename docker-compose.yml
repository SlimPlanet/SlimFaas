# Optional external exporter demo: see demo/external-autoscaling/README.md.
# Trusted demo only: Data, Streams and DLQ inspection/management are public.
x-demo-function: &demo-function
  image: axaguildev/fibonacci:dev
  build:
    context: .
    dockerfile: samples/Fibonacci/Dockerfile
  environment:
    ASPNETCORE_URLS: http://+:5000
    SlimFaas__BaseUrl: http://slimfaas:30021
  networks:
    - slimfaas-net
  healthcheck:
    test: ["CMD", "bash", "/app/healthcheck.sh"]
    interval: 2s
    timeout: 3s
    retries: 30
  labels: &demo-labels
    SlimFaas/Function: "true"
    SlimFaas/Namespace: "default"
    SlimFaas/ReplicasAtStart: "1"
    SlimFaas/ReplicasMin: "0"
    SlimFaas/TimeoutSecondBeforeSetReplicasMin: "120"
    SlimFaas/DefaultVisibility: "Public"
    SlimFaas/NumberParallelRequest: "10"
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: /metrics

networks:
  slimfaas-net:
    driver: bridge

services:

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # Id du broker
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1

      # KRaft : broker + controller sur le même noeud
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners internes
      # - PLAINTEXT pour les clients (consume/produce)
      # - CONTROLLER pour le quorum KRaft
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node dev
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - slimfaas-net


  slimfaas:
    container_name: slimfaas-1
    #image: axaguildev/slimfaas:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "30021:30021"
    user: "0:0"
    environment:
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
      ASPNETCORE_URLS: "http://0.0.0.0:30021"
      HOSTNAME: "slimfaas-1"
      SlimFaas__BaseSlimDataUrl: "http://localhost:3262/"
      SlimFaas__Orchestrator: "Docker"
      # Set true to expose only keys, expiry and file sizes in the dashboard.
      SlimFaas__ExposeDataMetadata: "false"
      SlimFaas__ExposeLogs: "true"
      Data__DefaultVisibility: Public
      SlimFaas__DeadLetterQueue__EnableFront: "true"
      SlimFaas__DeadLetterQueue__DefaultVisibility: Public
      SlimData__Directory: "/database"
      SlimData__BackupDirectory: "/backup"
      SlimFaas__JobsConfiguration: |
        {
          "Configurations": {
            "fibonacci": {
              "Image": "slimfaas-tour-batch:local",
              "ImagesWhitelist": [],
              "Resources": {
                "Requests": { "cpu": "400m", "memory": "400Mi" },
                "Limits":   { "cpu": "400m", "memory": "400Mi" }
              },
              "DependsOn": ["fibonacci1"],
              "Environments": [],
              "BackoffLimit": 1,
              "Visibility": "Public",
              "NumberParallelJob": 2,
              "TtlSecondsAfterFinished": 60,
              "RestartPolicy": "Never"
            }
          },
          "Schedules": {}
        }
      SlimFaas__RateLimiting__Enabled: "true"
      SlimFaas__RateLimiting__CpuHighThreshold: "80.0"
      SlimFaas__RateLimiting__CpuLowThreshold: "60.0"
      SlimFaas__RateLimiting__SampleIntervalMs: "1000"
      SlimFaas__RateLimiting__RetryAfterSeconds: "5"
      SlimFaas__RateLimiting__ExcludedPaths__0: "/health"
      SlimFaas__RateLimiting__ExcludedPaths__1: "/metrics"
      SlimFaas__RateLimiting__ExcludedPaths__2: "/ready"
    volumes:
      - slimfaas_data:/database
      - slimfaas_backup:/backup
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    security_opt:
     - label=disable
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - slimfaas-net
    labels:
      app: "slimfaas"
      com.docker.compose.service: "slimfaas"
      prometheus.io/scrape: "true"
      prometheus.io/port: "30021"
      prometheus.io/path: /metrics
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:30021/health"]  # ou 8080 selon l’option
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s


  fibonacci1:
    <<: *demo-function
    ports:
      - "${FIBONACCI_HOST_PORT:-5000}:5000"
    labels:
      <<: *demo-labels
      app: "fibonacci1"
      SlimFaas/Configuration: '{"DefaultSync":{"HttpTimeout":120},"DefaultAsync":{"HttpTimeout":30,"TimeoutRetries":[1],"HttpStatusRetries":[500,502,503,504],"DeadLetterQueue":{"Enabled":true,"MaxAgeSeconds":604800,"MaxLength":10000}},"DefaultPublish":{"HttpTimeout":120,"TimeoutRetries":[2,4,8],"HttpStatusRetries":[500,502,503]}}'
      SlimFaas/SubscribeStream: "Public:orders"
      SlimFaas/StreamMaxAge: "24h"
      SlimFaas/StreamMaxLength: "100000"
      SlimFaas/TimeoutSecondBeforeSetReplicasMin: "10"
      SlimFaas/NumberParallelRequestPerPod: "1"
      SlimFaas/Scale: '{"ReplicaMax":4,"Triggers":[{"MetricType":"Value","MetricName":"queue","Query":"max_over_time(slimfaas_function_queue_ready_items{function=\"fibonacci1\"}[30s])","Threshold":10}]}'
      SlimFaas/DefaultTrust: "Trusted"
      SlimFaas/SubscribeEvents : "fibo-public"

  fibonacci2:
    <<: *demo-function
    labels:
      <<: *demo-labels
      app: fibonacci2
      SlimFaas/DependsOn: fibonacci1
      SlimFaas/TimeoutSecondBeforeSetReplicasMin: "8"
      SlimFaas/SubscribeStream: "Public:orders"
      SlimFaas/StreamMaxAge: "24h"
      SlimFaas/StreamMaxLength: "100000"

  fibonacci3:
    <<: *demo-function
    labels:
      <<: *demo-labels
      app: fibonacci3
      SlimFaas/SubscribeEvents: fibo-public
      SlimFaas/ReplicasAtStart: "2"

  fibonacci4:
    <<: *demo-function
    labels:
      <<: *demo-labels
      app: fibonacci4
      SlimFaas/DefaultVisibility: Private
      SlimFaas/SubscribeEvents: Public:fibo-public
      SlimFaas/ReplicasAtStart: "2"

  slimfaas-kafka:
    #image: slimkafka:dev
    # ou build localement le projet SlimKafka si tu as le code à côté :
    build:
     context: .
     dockerfile: src/SlimFaasKafka/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      slimfaas:
        condition: service_started
    ports:
      - "5200:8080"
    labels:
      SlimFaas/Function: "true"
      app: "slimfaas-kafka"
      SlimFaas/Namespace: "default"
      SlimFaas/ReplicasAtStart: "1"
      SlimFaas/ReplicasMin: "1"
    environment:
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__CheckIntervalSeconds=5
      - Kafka__KafkaTimeoutSeconds=5
      - SlimFaas__BaseUrl=http://slimfaas:30021
      - SlimFaasKafka__Bindings__0__Topic=fibo-public
      - SlimFaasKafka__Bindings__0__ConsumerGroupId=fibonacci-listener-group
      - SlimFaasKafka__Bindings__0__FunctionName=fibonaccikafkalistener
      - SlimFaasKafka__Bindings__0__MinPendingMessages=1
      - SlimFaasKafka__Bindings__0__CooldownSeconds=30
      - SlimFaasKafka__Bindings__0__ActivityKeepAliveSeconds=60
      - SlimFaasKafka__Bindings__0__MinConsumedDeltaForActivity=1
    networks:
      - slimfaas-net


  fibonacci-kafka-producer:
    build:
      context: .
      dockerfile: samples/FibonacciKafkaProducer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5100:8080"
    environment:
      - Kafka__BootstrapServers=kafka:9092
    networks:
      - slimfaas-net

  fibonacci-kafka-listener:
    build:
      context: .
      dockerfile: samples/FibonacciKafkaListener/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=fibo-public
      - Kafka__GroupId=fibonacci-listener-group
    labels:
      SlimFaas/Function: "true"
      app: "fibonacci-kafka-listener"
      SlimFaas/Namespace: "default"
      SlimFaas/TimeoutSecondBeforeSetReplicasMin: "10"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - slimfaas-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: slimfaas-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - slimfaas-net

volumes:
  slimfaas_data:
  slimfaas_backup:
